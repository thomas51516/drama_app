# DRAMA — services de développement (S01-OPS-02)
# Usage : docker compose -f infra/docker-compose.dev.yml up -d
# Variables surchargeables via l'environnement ou un fichier infra/.env (voir infra/README.md).
name: drama-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: drama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drama}
      POSTGRES_DB: ${POSTGRES_DB:-drama}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drama} -d ${POSTGRES_DB:-drama}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sauvegarde quotidienne de PostgreSQL (S05-OPS-01) : pg_dump -Fc compressé dans le volume
  # `postgres-backups`, rétention BACKUP_RETENTION_DAYS (14 jours). Première sauvegarde au démarrage,
  # puis toutes les BACKUP_INTERVAL_SECONDS (24 h). Scripts hôte : infra/scripts/backup.sh et restore.sh.
  postgres-backup:
    image: postgres:16-alpine
    container_name: drama-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-drama}
      PGPASSWORD: ${POSTGRES_PASSWORD:-drama}
      PGDATABASE: ${POSTGRES_DB:-drama}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - postgres-backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/drama-backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      # En cas d'échec (ex. Postgres pas encore prêt après un redémarrage du conteneur : `depends_on`
      # n'est réévalué qu'au `docker compose up`, pas par la politique `restart` native), on retente
      # après 5 min plutôt que d'attendre tout l'intervalle de 24 h — sinon un échec transitoire creuse
      # un trou d'une journée dans les sauvegardes (trouvé en drill S10-OPS-03 : un essai raté laissait
      # un `.dump.part` de 0 octet et la prochaine tentative n'était prévue que 24 h plus tard).
      - |
        while true; do
          if sh /usr/local/bin/drama-backup.sh "$$BACKUP_DIR"; then
            sleep "$$BACKUP_INTERVAL_SECONDS"
          else
            echo "[backup] échec $$(date -u +%FT%TZ), nouvelle tentative dans 5 min"
            sleep 300
          fi
        done

  redis:
    image: redis:7-alpine
    container_name: drama-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NOTE : les images officielles `minio/minio` et `minio/mc` ont été retirées de Docker Hub
  # (pull anonyme refusé en octobre 2026). On utilise l'image Bitnami figée (MinIO 2025.5.24,
  # serveur + client `mc` inclus), suffisante pour le développement local.
  minio:
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5
    container_name: drama-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Crée le bucket au démarrage (format bitnami : "nom:politique").
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-drama-media}:download
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      # CORS de l'API S3 : le back-office (3100) fait des PUT directs sur les URLs pré-signées (S02-BE-04)
      # et les lecteurs web lisent les sous-titres WebVTT `subtitles/{episodeId}/{lang}.vtt` (S03-BE-03).
      # `*` = lecture depuis n'importe quelle origine (téléphone sur le Wi-Fi, aperçu du back-office) ;
      # les PUT restent protégés par la signature des URLs. Restreindre via MINIO_CORS_ORIGINS si besoin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:-*}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Service one-shot (idempotent) : garantit l'existence du bucket `drama-media` puis s'arrête.
  # Relance manuelle : docker compose -f infra/docker-compose.dev.yml run --rm minio-init
  minio-init:
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5
    container_name: drama-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-drama-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set download "local/$$S3_BUCKET" &&
        echo "Bucket $$S3_BUCKET prêt"
    restart: "no"

volumes:
  postgres-data:
  postgres-backups:
  redis-data:
  minio-data:
