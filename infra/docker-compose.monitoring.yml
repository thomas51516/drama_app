# DRAMA — supervision locale / staging (S02-OPS-02) : Prometheus + Grafana.
# Usage : docker compose -f infra/docker-compose.monitoring.yml up -d
#   Prometheus : http://localhost:9090 — Grafana : http://localhost:3300 (admin / admin)
# L'API doit tourner sur l'hôte (npm run dev) avec METRICS_ENABLED=true ; si METRICS_TOKEN est défini
# côté API, renseigner le bloc `authorization` de monitoring/prometheus.yml avec la même valeur.
name: drama-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: drama-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: drama-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
