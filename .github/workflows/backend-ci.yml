name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drama
          POSTGRES_PASSWORD: drama
          POSTGRES_DB: drama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drama -d drama_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Stockage objet pour les tests e2e d'upload pré-signé (S02-BE-04) ; bucket créé au démarrage.
      minio:
        image: bitnamilegacy/minio:2025.5.24-debian-12-r5
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: drama-media:download
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://drama:drama@localhost:5432/drama_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef0123456789
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: drama-media
      CDN_BASE_URL: http://localhost:9000/drama-media
      ADMIN_JWT_SECRET: ci-only-admin-secret-0123456789abcdef0123456789
      TOTP_ENCRYPTION_KEY: ci-only-totp-key-0123456789abcdef0123456789
      TRANSCODE_PROVIDER: webhook
      TRANSCODE_WORKER_ENABLED: 'false'
      TRANSCODE_WEBHOOK_SECRET: ci-only-transcode-webhook-secret-0123456789
      MEDIA_SIGNER: plain
      SMS_PROVIDER: console
      SCHEDULER_ENABLED: 'false'
      PUSH_PROVIDER: log
      PUSH_QUEUE_ENABLED: 'false'
      SWAGGER_ENABLED: 'true'
      BILLING_VERIFIER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ffmpeg : prérequis du worker local (les tests unitaires le simulent ; présent pour scripts/smoke-ingest.ts).
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: E2E tests
        run: npm run test:e2e

      - name: OpenAPI v1 export is up to date
        run: |
          node dist/openapi-export.js /tmp/openapi.v1.json
          diff -u ../docs/api/openapi.v1.json /tmp/openapi.v1.json
